<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NERATH</title><style>
*{box-sizing:border-box}body{margin:0;background:#0e1b25;color:#e9eee7;font:14px system-ui;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}header{position:absolute;top:0;left:0;right:0;padding:14px;background:linear-gradient(#07131ce9,transparent);display:flex;justify-content:space-between;gap:8px;pointer-events:none}header b{font-size:23px;letter-spacing:4px;color:#e4d3a3}#resources{background:#0a1b23d9;border:1px solid #5c716b;border-radius:8px;padding:8px;font-size:12px}footer{position:absolute;bottom:0;left:0;right:0;padding:12px;background:linear-gradient(transparent,#081820 20%);display:flex;gap:8px;align-items:end}#status{background:#162b31ed;border:1px solid #50675f;border-radius:9px;padding:12px;flex:1;min-width:0;font-size:12px}#status strong{color:#e7c981}#buttons{display:flex;gap:5px;flex-wrap:wrap;justify-content:end;max-width:58%}button{background:#295151;color:#fff;border:1px solid #729088;border-radius:8px;padding:11px 8px;font-weight:700}#notice{position:absolute;top:85px;left:10px;right:10px;text-align:center;text-shadow:0 2px 3px #000;pointer-events:none;font-size:12px}#dialog{display:none;position:absolute;inset:0;background:#000b;align-items:center;justify-content:center;padding:20px}#dialog>div{background:#182d33;border:1px solid #8c9d89;border-radius:14px;padding:20px;max-width:520px;max-height:80vh;overflow:auto}#dialog h2{color:#e4d3a3}@media(max-width:550px){header b{font-size:17px}button{font-size:11px;padding:9px 6px}#buttons{max-width:55%}}</style></head><body>
<canvas id="c"></canvas><header><div><b>NERATH</b><div style="font-size:10px">STRATEGIE · VEYRA</div></div><div id="resources"></div></header><div id="notice">Soldat oder Panzer antippen · Gelände antippen zum Bewegen · Ziehen / Zwei-Finger-Zoom</div>
<footer><div id="status"><strong id="title">Kommandozentrale Veyra</strong><div id="detail">Wähle eine Einheit auf der Karte.</div></div><div id="buttons"><button id="soldier">+ Soldat</button><button id="tank">+ Panzer</button><button id="build">Bauen</button><button id="advisors">Berater</button><button id="turn">Runde ▶</button></div></footer><div id="dialog"><div><h2 id="dialogTitle"></h2><div id="dialogBody"></div><button id="close">Schließen</button></div></div>
<script>
(function(){
var c=document.getElementById('c'),g=c.getContext('2d'),w=0,h=0,z=1,ox=0,oy=0,sel=-1,round=1,cash=1200,food=100,power=90,seq=5,drag=0,pointers=new Map();
var units=[{id:1,x:12,y:12,type:'Soldat'},{id:2,x:13,y:12,type:'Soldat'},{id:3,x:11,y:14,type:'Panzer'},{id:4,x:12,y:15,type:'Soldat'}];
var towns=[{x:10,y:10,type:'HQ',name:'Veyra'},{x:16,y:12,type:'Stadt',name:'Orvannis'},{x:8,y:20,type:'Stadt',name:'Terenza'},{x:22,y:17,type:'Stadt',name:'Solkar'},{x:13,y:9,type:'Fabrik',name:'Veyra'},{x:9,y:14,type:'Farm',name:'Veyra'}];
function $(id){return document.getElementById(id)}function rand(x,y){var a=Math.sin(x*127.1+y*311.7)*43758.5453;return a-Math.floor(a)}
function island(x,y){return Math.hypot((x-15)/18,(y-15)/18)<1.05 && Math.sin(x*.3)+Math.cos(y*.3)>-1.45}
function pt(x,y,alt){return {x:(x-y)*24*z+w/2+ox,y:(x+y)*12*z+h*.23+oy-(alt||0)*z}}
function inv(x,y){var a=(x-w/2-ox)/(24*z),b=(y-h*.23-oy)/(12*z);return {x:(a+b)/2,y:(b-a)/2}}
function poly(a,color){g.beginPath();a.forEach(function(p,i){if(!i)g.moveTo(p.x,p.y);else g.lineTo(p.x,p.y)});g.closePath();g.fillStyle=color;g.fill()}
function line(a,b,color,width){g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.strokeStyle=color;g.lineWidth=width||1;g.stroke()}
function oval(x,y,rx,ry,color){g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fillStyle=color;g.fill()}
function cube(x,y,dx,dy,ht,top,side){var a=pt(x-dx/2,y-dy/2),b=pt(x+dx/2,y-dy/2),d=pt(x+dx/2,y+dy/2),e=pt(x-dx/2,y+dy/2),A=pt(x-dx/2,y-dy/2,ht),B=pt(x+dx/2,y-dy/2,ht),D=pt(x+dx/2,y+dy/2,ht),E=pt(x-dx/2,y+dy/2,ht);poly([b,d,D,B],side);poly([d,e,E,D],'#3b514e');poly([A,B,D,E],top)}
function tree(x,y){var p=pt(x,y);line(p,{x:p.x,y:p.y-14*z},'#65543b',2*z);oval(p.x,p.y-17*z,6*z,10*z,rand(x,y)>.5?'#31563d':'#3c6848')}
function draw(){g.fillStyle='#173b4b';g.fillRect(0,0,w,h);for(var y=0;y<30;y++)for(var x=0;x<30;x++){if(!island(x,y))continue;var r=rand(x,y);poly([pt(x,y),pt(x+1,y),pt(x+1,y+1),pt(x,y+1)],r>.8?'#788366':r>.4?'#567751':'#436c50');if(r>.88&&!towns.some(function(t){return Math.hypot(t.x-x,t.y-y)<2.5}))tree(x+.4,y+.3)}
towns.forEach(function(t){var ht=t.type==='HQ'?42:t.type==='Fabrik'?24:t.type==='Farm'?12:29;cube(t.x,t.y,t.type==='Farm'?1.4:2.2,1.8,ht,t.type==='HQ'?'#d0c7a1':'#a2b0a4','#536963');var p=pt(t.x,t.y,ht+13);g.textAlign='center';g.font='bold '+Math.max(10,11*z)+'px system-ui';g.fillStyle='#fff0c9';g.shadowColor='#000';g.shadowBlur=5;g.fillText(t.name,p.x,p.y);g.shadowBlur=0});
units.forEach(function(u){var p=pt(u.x,u.y);oval(p.x,p.y+3*z,15*z,6*z,'#0007');if(u.type==='Panzer'){cube(u.x,u.y,1.25,.85,11,'#647b59','#344b3e');cube(u.x,u.y,.65,.55,17,'#7d906b','#425b4b');line(pt(u.x,u.y,17),pt(u.x+1.1,u.y,18),'#283b30',5*z)}else{line({x:p.x-3*z,y:p.y-8*z},{x:p.x-5*z,y:p.y+2*z},'#222e29',3*z);line({x:p.x+3*z,y:p.y-8*z},{x:p.x+5*z,y:p.y+2*z},'#222e29',3*z);oval(p.x,p.y-13*z,6*z,9*z,'#50664b');oval(p.x,p.y-24*z,5*z,5*z,'#c3ac89');oval(p.x,p.y-27*z,6*z,3*z,'#536a50');line({x:p.x+3*z,y:p.y-15*z},{x:p.x+12*z,y:p.y-13*z},'#26322f',3*z)}if(sel===u.id){g.beginPath();g.ellipse(p.x,p.y+2*z,18*z,8*z,0,0,Math.PI*2);g.strokeStyle='#ffdc7e';g.lineWidth=2;g.stroke()}});
requestAnimationFrame(draw)}
function sync(){try{localStorage.setItem('nerath',JSON.stringify({units:units,towns:towns,round:round,cash:cash,food:food,power:power,seq:seq}))}catch(e){}$('resources').textContent='Runde '+round+'  ·  💰 '+cash+'  ·  🌾 '+food+'  ·  ⚡ '+power;var u=units.find(function(q){return q.id===sel});$('title').textContent=u?u.type+' #'+u.id:'Kommandozentrale Veyra';$('detail').textContent=u?'Tippe auf eine freie Stelle der Karte, um die Einheit dorthin zu bewegen.':'Wähle eine Einheit auf der Karte.'}
try{var save=JSON.parse(localStorage.getItem('nerath'));if(save&&save.units){units=save.units;towns=save.towns;round=save.round;cash=save.cash;food=save.food;power=save.power;seq=save.seq}}catch(e){}
function message(t){$('notice').textContent=t;setTimeout(function(){$('notice').textContent='Einheit antippen · Gelände antippen zum Bewegen · Ziehen / Zwei-Finger-Zoom'},3000)}
function add(type,cost){if(cash<cost)return message('Nicht genug Geld');cash-=cost;units.push({id:seq++,x:10+rand(seq,3)*3,y:11+rand(seq,7)*3,type:type});sync();message(type+' rekrutiert')}
$('soldier').onclick=function(){add('Soldat',120)};$('tank').onclick=function(){add('Panzer',340)};
function dialog(title,body){$('dialogTitle').textContent=title;$('dialogBody').innerHTML=body;$('dialog').style.display='flex'}
$('close').onclick=function(){$('dialog').style.display='none'};
$('advisors').onclick=function(){dialog('Rat von Veyra','<p>Elian Voss · Wirtschaft: Ausbau der Industrie empfohlen.</p><p>Mira Selven · Diplomatie: Orvannis beobachtet uns.</p><p>Darian Kest · Verteidigung: Die Hauptstadt sichern.</p><p>Nira Valek · Geheimdienst: Informationen sind noch unvollständig.</p><p>Tavian Rell · Inneres: Versorgung stabilisieren.</p><p><small>Dies sind feste Empfehlungen. Autonome KI-Verhandlungen sind noch nicht implementiert.</small></p>')};
$('build').onclick=function(){dialog('Bauverwaltung','<p>Neue Gebäude werden in Veyra errichtet.</p><button id="factory">Fabrik · 400</button> <button id="farm">Farm · 250</button> <button id="plant">Kraftwerk · 350</button>')};
$('dialog').onclick=function(e){var opts={factory:['Fabrik',400],farm:['Farm',250],plant:['Kraftwerk',350]},a=opts[e.target.id];if(!a)return;if(cash<a[1])return message('Nicht genug Geld');cash-=a[1];var n=towns.length;towns.push({x:8+n%5,y:16+Math.floor(n/5)*2,type:a[0],name:'Veyra'});$('dialog').style.display='none';sync();message(a[0]+' errichtet')};
$('turn').onclick=function(){round++;cash+=160+towns.filter(function(t){return t.type==='Fabrik'}).length*90;food+=towns.filter(function(t){return t.type==='Farm'}).length*30-units.length*3;power+=towns.filter(function(t){return t.type==='Kraftwerk'}).length*30-units.filter(function(t){return t.type==='Panzer'}).length*4;sync();message('Runde '+round+' abgeschlossen')};
function resize(){w=innerWidth;h=innerHeight;var d=Math.min(devicePixelRatio||1,2);c.width=w*d;c.height=h*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
c.addEventListener('pointerdown',function(e){c.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});drag=0});
c.addEventListener('pointermove',function(e){if(!pointers.has(e.pointerId))return;var p=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){var a=Array.from(pointers.values()),dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),old=Math.hypot((a[0].x-(e.pointerId===Array.from(pointers.keys())[0]?e.clientX-p.x:0))-a[1].x,(a[0].y-(e.pointerId===Array.from(pointers.keys())[0]?e.clientY-p.y:0))-a[1].y);if(old)z=Math.max(.5,Math.min(2.4,z*dist/old));drag=100}else{ox+=e.clientX-p.x;oy+=e.clientY-p.y;drag+=Math.abs(e.clientX-p.x)+Math.abs(e.clientY-p.y)}});
c.addEventListener('pointerup',function(e){if(pointers.size===1&&drag<12){var q=inv(e.clientX,e.clientY),u=units.find(function(v){return Math.hypot(v.x-q.x,v.y-q.y)<1.2});if(u){sel=u.id;message(u.type+' ausgewählt')}else if(sel>=0&&island(q.x,q.y)){u=units.find(function(v){return v.id===sel});if(u){u.x=q.x;u.y=q.y;message('Bewegungsbefehl ausgeführt')}}sync()}pointers.delete(e.pointerId)});
c.addEventListener('pointercancel',function(e){pointers.delete(e.pointerId)});
c.addEventListener('wheel',function(e){e.preventDefault();z=Math.max(.5,Math.min(2.4,z*(e.deltaY>0?.92:1.08)))},{passive:false});
sync();requestAnimationFrame(draw);
})();
</script></body></html>
